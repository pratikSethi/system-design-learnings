<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title    { font-size: 25px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 14px; fill: #6b7280; }
      .box      { font-size: 15px; font-weight: 600; fill: #111827; }
      .sub      { font-size: 11.5px; fill: #6b7280; }
      .lbl      { font-size: 12px; font-weight: 600; fill: #374151; }
      .lblblue  { font-size: 12px; font-weight: 600; fill: #2563eb; }
      .lblpurple{ font-size: 12px; font-weight: 700; fill: #7c3aed; }
      .lblgreen { font-size: 12px; font-weight: 700; fill: #059669; }
      .mono     { font-size: 11.5px; font-family: 'SFMono-Regular', Consolas, monospace; fill: #374151; }
      .monosm   { font-size: 10.5px; font-family: 'SFMono-Regular', Consolas, monospace; fill: #6b7280; }
      .step     { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .note     { font-size: 12px; fill: #4b5563; }
      .owner    { font-size: 11px; font-weight: 700; letter-spacing: .3px; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f9fafb"/>
  <text x="40" y="42" class="title">Federation: resolving one query across two subgraphs</text>
  <text x="40" y="66" class="subtitle">Query: <tspan font-family="monospace" font-size="13px">{ shows { title reviews { rating } } }</tspan> — title is Catalog's, reviews is Reviews'. The router plans, fans out, and stitches by the Show @key.</text>

  <!-- ============ CLIENT ============ -->
  <rect x="40" y="100" width="150" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="115" y="130" text-anchor="middle" class="box">Client</text>
  <text x="115" y="150" text-anchor="middle" class="sub">phone / TV / web</text>

  <!-- client -> router -->
  <line x1="190" y1="133" x2="252" y2="133" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="221" y="125" text-anchor="middle" class="lblblue">1 query</text>

  <!-- ============ ROUTER ============ -->
  <rect x="254" y="96" width="220" height="120" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="364" y="124" text-anchor="middle" class="box">Apollo Router</text>
  <text x="364" y="144" text-anchor="middle" class="sub">holds the supergraph</text>
  <rect x="268" y="156" width="192" height="48" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="364" y="175" text-anchor="middle" class="lblpurple">query plan</text>
  <text x="364" y="192" text-anchor="middle" class="sub">title → Catalog · reviews → Reviews</text>

  <!-- router -> back to client (response) -->
  <path d="M300,216 C 300,250 200,250 160,250 L 160,180" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowPurple)"/>
  <text x="150" y="235" text-anchor="middle" class="sub">stitched response</text>

  <!-- ============ STEP 1: Catalog ============ -->
  <circle cx="600" cy="150" r="14" fill="#059669"/>
  <text x="600" y="155" text-anchor="middle" class="step">1</text>
  <line x1="474" y1="150" x2="560" y2="150" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="518" y="142" text-anchor="middle" class="lblgreen">fetch shows</text>

  <rect x="628" y="112" width="240" height="90" rx="10" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
  <text x="644" y="103" class="owner" fill="#047857">CATALOG SUBGRAPH — owns Show</text>
  <text x="748" y="140" text-anchor="middle" class="box">Query.shows</text>
  <text x="748" y="160" text-anchor="middle" class="sub">returns [{ id, title }, …]</text>
  <text x="748" y="182" text-anchor="middle" class="monosm">Show @key(fields: "id")</text>

  <!-- catalog result feeding back to router -->
  <path d="M628,175 C 540,175 540,180 474,180" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>
  <text x="551" y="197" text-anchor="middle" class="sub">ids + titles</text>

  <!-- ============ STEP 2: router -> reviews via _entities ============ -->
  <circle cx="360" cy="300" r="14" fill="#7c3aed"/>
  <text x="360" y="305" text-anchor="middle" class="step">2</text>
  <text x="470" y="292" text-anchor="middle" class="lblpurple">for each Show id, ask its owner-of-reviews</text>

  <!-- router down to reviews -->
  <path d="M420,216 C 500,280 640,300 700,330" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- the _entities payload callout -->
  <rect x="360" y="330" width="300" height="86" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="375" y="352" class="lbl">router sends an <tspan font-weight="700">entity reference</tspan>:</text>
  <text x="375" y="374" class="mono">_entities(representations: [</text>
  <text x="392" y="392" class="mono">{ __typename: "Show", id: "1" }, …</text>
  <text x="375" y="410" class="mono">])</text>

  <!-- ============ REVIEWS SUBGRAPH ============ -->
  <rect x="700" y="300" width="270" height="150" rx="10" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
  <text x="716" y="291" class="owner" fill="#047857">REVIEWS SUBGRAPH — owns Review</text>

  <rect x="716" y="316" width="238" height="52" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="835" y="337" text-anchor="middle" class="box" font-size="13">Show.__resolveReference</text>
  <text x="835" y="355" text-anchor="middle" class="sub">turns { id } into a parent to attach to</text>

  <rect x="716" y="378" width="238" height="60" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="835" y="399" text-anchor="middle" class="box" font-size="13">Show.reviews / averageRating</text>
  <text x="835" y="417" text-anchor="middle" class="sub">fetch reviews by showId</text>
  <text x="835" y="432" text-anchor="middle" class="monosm">reviews doesn't own title/cast — only the id</text>

  <!-- reviews back to router -->
  <path d="M700,410 C 560,440 480,300 424,224" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>
  <text x="470" y="470" text-anchor="middle" class="sub">reviews for each id</text>

  <!-- ============ STEP 3: stitch ============ -->
  <circle cx="360" cy="560" r="14" fill="#2563eb"/>
  <text x="360" y="565" text-anchor="middle" class="step">3</text>
  <text x="364" y="600" text-anchor="middle" class="lblblue" font-size="13">Router stitches by @key → one response</text>

  <!-- final response object -->
  <rect x="620" y="520" width="540" height="180" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="640" y="546" class="mono">{ "shows": [</text>
  <text x="660" y="566" class="mono">  { "title": "Stranger Things",   <tspan fill="#059669">← Catalog</tspan></text>
  <text x="660" y="586" class="mono">    "reviews": [{ "rating": 5 }, { "rating": 4 }] <tspan fill="#059669">← Reviews</tspan></text>
  <text x="660" y="606" class="mono">  },</text>
  <text x="660" y="626" class="mono">  { "title": "Glass Onion",       <tspan fill="#059669">← Catalog</tspan></text>
  <text x="660" y="646" class="mono">    "reviews": []                 <tspan fill="#6b7280">(no reviews yet)</tspan></text>
  <text x="660" y="666" class="mono">  }, …</text>
  <text x="640" y="686" class="mono">] }</text>

  <!-- key takeaway band -->
  <rect x="40" y="640" width="540" height="120" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="60" y="668" class="lbl" font-size="13" fill="#b45309">The key idea</text>
  <text x="60" y="692" class="note">The router never sees a "join." It fetches the <tspan font-weight="700">Show</tspan> from Catalog,</text>
  <text x="60" y="712" class="note">then passes each Show's <tspan font-weight="700">@key (id)</tspan> to Reviews as an entity</text>
  <text x="60" y="732" class="note">reference — Reviews hydrates it via <tspan font-family="monospace">__resolveReference</tspan> and adds</text>
  <text x="60" y="752" class="note">its fields. Two independent services, stitched by a shared id.</text>

  <!-- legend -->
  <line x1="640" y1="726" x2="672" y2="726" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="680" y="730" class="note">request / entity reference (router → subgraph)</text>
  <line x1="640" y1="748" x2="672" y2="748" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>
  <text x="680" y="752" class="note">data returned (subgraph → router)</text>
</svg>
