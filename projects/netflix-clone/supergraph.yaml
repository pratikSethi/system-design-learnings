# Composition config for the federated graph.
#
# Lists the subgraphs that make up the supergraph and where each runs. `rover dev` reads
# this, fetches each subgraph's schema from its routing_url, composes them into one
# supergraph, and runs the Apollo Router in front (default :4000).
#
# Run (with catalog on :4001 and reviews on :4002 already up):
#   rover dev --supergraph-config supergraph.yaml
#
# federation_version pins the composition algorithm to Federation 2.
federation_version: =2.7.0

subgraphs:
  catalog:
    routing_url: http://localhost:4001/
    schema:
      subgraph_url: http://localhost:4001/
  reviews:
    routing_url: http://localhost:4002/
    schema:
      subgraph_url: http://localhost:4002/
