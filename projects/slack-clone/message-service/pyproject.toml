[project]
name = "message-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.83.0",
    "grpcio-reflection>=1.83.0",
    "grpcio-tools>=1.83.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Make the message_service package importable without installing it: the tests
# import `from message_service import ...`, so pytest must see the project root.
pythonpath = ["."]
testpaths = ["tests"]
