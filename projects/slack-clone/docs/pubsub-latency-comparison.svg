<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="agray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
    <style>
      .title  { font-size: 25px; font-weight: 700; fill: #111827; }
      .col     { font-size: 19px; font-weight: 700; }
      .sub2    { font-size: 12.5px; fill: #6b7280; }
      .box     { font-size: 13.5px; font-weight: 600; fill: #111827; }
      .bs      { font-size: 11px; fill: #6b7280; }
      .lat     { font-size: 12.5px; font-weight: 700; }
      .hop     { font-size: 11.5px; font-weight: 600; fill: #374151; }
      .tot     { font-size: 15px; font-weight: 700; }
      .note    { font-size: 12.5px; fill: #4b5563; }
      .tag     { font-size: 11px; font-weight: 700; fill: #fff; }
    </style>
  </defs>

  <rect width="1280" height="1080" fill="#f9fafb"/>
  <text x="40" y="44" class="title">Two message-delivery architectures — where the latency goes (same region, both online)</text>

  <!-- ================= LEFT: Kafka durable fan-out ================= -->
  <rect x="30" y="70" width="600" height="830" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="55" y="102" class="col" fill="#b91c1c">Kafka durable fan-out</text>
  <text x="55" y="122" class="sub2">transport = durable log · higher latency, extra hops</text>

  <!-- nodes left column, centered x=200 -->
  <g>
    <rect x="120" y="145" width="160" height="52" rx="9" fill="#fff" stroke="#f87171" stroke-width="2"/>
    <text x="200" y="170" text-anchor="middle" class="box">Client A</text>
    <text x="200" y="187" text-anchor="middle" class="bs">sends message</text>

    <rect x="120" y="255" width="160" height="52" rx="9" fill="#fff" stroke="#f87171" stroke-width="2"/>
    <text x="200" y="280" text-anchor="middle" class="box">Gateway (WS)</text>
    <text x="200" y="297" text-anchor="middle" class="bs">= gRPC client</text>

    <rect x="120" y="365" width="160" height="52" rx="9" fill="#fff" stroke="#f87171" stroke-width="2"/>
    <text x="200" y="390" text-anchor="middle" class="box">message-service</text>
    <text x="200" y="407" text-anchor="middle" class="bs">persist + assign id</text>

    <rect x="120" y="475" width="160" height="52" rx="9" fill="#fff" stroke="#f87171" stroke-width="2"/>
    <text x="200" y="500" text-anchor="middle" class="box">Kafka</text>
    <text x="200" y="517" text-anchor="middle" class="bs">disk + replica ack</text>

    <rect x="120" y="585" width="160" height="52" rx="9" fill="#fff" stroke="#f87171" stroke-width="2"/>
    <text x="200" y="610" text-anchor="middle" class="box">Fan-out consumer</text>
    <text x="200" y="627" text-anchor="middle" class="bs">polls the topic</text>

    <rect x="120" y="695" width="160" height="52" rx="9" fill="#fff" stroke="#f87171" stroke-width="2"/>
    <text x="200" y="720" text-anchor="middle" class="box">Gateway (WS)</text>
    <text x="200" y="737" text-anchor="middle" class="bs">B's socket</text>

    <rect x="120" y="805" width="160" height="52" rx="9" fill="#fff" stroke="#f87171" stroke-width="2"/>
    <text x="200" y="830" text-anchor="middle" class="box">Client B</text>
    <text x="200" y="847" text-anchor="middle" class="bs">renders message</text>
  </g>

  <!-- arrows + latency left -->
  <line x1="200" y1="197" x2="200" y2="253" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="215" y="228" class="hop">WS frame + last mile</text>
  <text x="360" y="228" class="lat" fill="#dc2626">~20 ms</text>

  <line x1="200" y1="307" x2="200" y2="363" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="215" y="338" class="hop">gRPC (in-region)</text>
  <text x="360" y="338" class="lat" fill="#dc2626">~3 ms</text>

  <line x1="200" y1="417" x2="200" y2="473" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="215" y="442" class="hop">DB write + Kafka publish</text>
  <text x="360" y="442" class="lat" fill="#dc2626">~15 ms</text>

  <line x1="200" y1="527" x2="200" y2="583" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="215" y="552" class="hop">consumer poll delay</text>
  <text x="360" y="552" class="lat" fill="#dc2626">~10-30 ms</text>

  <line x1="200" y1="637" x2="200" y2="693" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="215" y="662" class="hop">deliver to gateway</text>
  <text x="360" y="662" class="lat" fill="#dc2626">~3 ms</text>

  <line x1="200" y1="747" x2="200" y2="803" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="215" y="772" class="hop">WS push + last mile</text>
  <text x="360" y="772" class="lat" fill="#dc2626">~20 ms</text>

  <rect x="120" y="875" width="420" height="0" fill="none"/>
  <text x="470" y="150" text-anchor="middle" class="tot" fill="#b91c1c">≈ 70–90 ms</text>
  <text x="470" y="172" text-anchor="middle" class="sub2">in-region, both online</text>

  <!-- ================= RIGHT: Redis dual-path ================= -->
  <rect x="660" y="70" width="590" height="830" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="685" y="102" class="col" fill="#047857">Redis dual-path (Hello Interview)</text>
  <text x="685" y="122" class="sub2">durable write + in-memory fast lane · at-most-once, backstopped</text>

  <!-- nodes right, centered x=820 -->
  <g>
    <rect x="740" y="145" width="160" height="52" rx="9" fill="#fff" stroke="#4ade80" stroke-width="2"/>
    <text x="820" y="170" text-anchor="middle" class="box">Client A</text>
    <text x="820" y="187" text-anchor="middle" class="bs">sends message</text>

    <rect x="740" y="275" width="160" height="52" rx="9" fill="#fff" stroke="#22c55e" stroke-width="2.5"/>
    <text x="820" y="300" text-anchor="middle" class="box">Chat Server (WS)</text>
    <text x="820" y="317" text-anchor="middle" class="bs">holds A's socket</text>

    <rect x="740" y="695" width="160" height="52" rx="9" fill="#fff" stroke="#22c55e" stroke-width="2.5"/>
    <text x="820" y="720" text-anchor="middle" class="box">Chat Server (WS)</text>
    <text x="820" y="737" text-anchor="middle" class="bs">B's socket</text>

    <rect x="740" y="805" width="160" height="52" rx="9" fill="#fff" stroke="#4ade80" stroke-width="2"/>
    <text x="820" y="830" text-anchor="middle" class="box">Client B</text>
    <text x="820" y="847" text-anchor="middle" class="bs">renders message</text>

    <!-- fast lane: redis -->
    <rect x="1020" y="410" width="170" height="60" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
    <text x="1105" y="435" text-anchor="middle" class="box">Redis pub/sub</text>
    <text x="1105" y="452" text-anchor="middle" class="bs">in-memory, sub-ms</text>
    <text x="1105" y="466" text-anchor="middle" class="bs">stores nothing</text>

    <!-- durable lane: DB -->
    <rect x="740" y="410" width="170" height="60" rx="9" fill="#fff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="M760 432 a65 7 0 0 0 130 0" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="825" y="446" text-anchor="middle" class="box">DB / Inbox</text>
    <text x="825" y="462" text-anchor="middle" class="bs">durable, off critical path</text>
  </g>

  <!-- A -> chat server -->
  <line x1="820" y1="197" x2="820" y2="273" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <text x="835" y="240" class="hop">WS frame + last mile</text>
  <text x="835" y="257" class="lat" fill="#059669">~20 ms</text>

  <!-- chat server -> durable (side, dashed, off path) -->
  <line x1="820" y1="327" x2="820" y2="408" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#agray)"/>
  <text x="600" y="360" class="hop" fill="#6b7280">write first</text>
  <text x="600" y="376" class="hop" fill="#6b7280">(durability,</text>
  <text x="600" y="392" class="hop" fill="#6b7280">not blocking B)</text>

  <!-- chat server -> redis -->
  <path d="M900 300 C 1000 300, 1040 360, 1090 408" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <text x="950" y="330" class="hop">publish</text>
  <text x="950" y="347" class="lat" fill="#059669">&lt; 1 ms</text>

  <!-- redis -> chat server B -->
  <path d="M1090 470 C 1040 560, 960 640, 900 700" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <text x="1000" y="590" class="hop">deliver</text>
  <text x="1000" y="607" class="lat" fill="#059669">~2 ms</text>

  <!-- chat server B -> client B -->
  <line x1="820" y1="747" x2="820" y2="803" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <text x="835" y="772" class="hop">WS push + last mile</text>
  <text x="835" y="789" class="lat" fill="#059669">~20 ms</text>

  <text x="1090" y="150" text-anchor="middle" class="tot" fill="#047857">≈ 42–45 ms</text>
  <text x="1090" y="172" text-anchor="middle" class="sub2">in-region, both online</text>

  <!-- ================= BOTTOM: cross-geo note ================= -->
  <rect x="30" y="920" width="1220" height="140" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="55" y="950" class="col" fill="#1d4ed8" font-size="17">Cross-geo: the floor neither design can beat</text>
  <text x="55" y="976" class="note">Once A and B are in different regions, one cross-region hop is unavoidable — it's the speed of light in fiber (~⅔ c), not your architecture:</text>
  <text x="70" y="1000" class="note">• US-East ↔ US-West ~60–80ms RTT   • US ↔ Europe ~80–100ms   • US ↔ India ~200–250ms   • US ↔ Australia ~200–280ms</text>
  <text x="55" y="1026" class="note" font-weight="700" fill="#1d4ed8">Rule: keep auth, DB write and fan-out in-region; pay the cross-region cost exactly once. &lt; 500ms budget absorbs it; sub-100ms cross-ocean is physically impossible.</text>
  <text x="55" y="1048" class="note" fill="#6b7280">Redis pub/sub is single-region — route the publish to the recipient's region (presence registry tracks region), or use a home-region / cell-based design.</text>

  <!-- fast vs durable tags -->
  <rect x="1150" y="405" width="86" height="20" rx="6" fill="#10b981"/>
  <text x="1193" y="419" text-anchor="middle" class="tag">FAST LANE</text>
  <rect x="695" y="405" width="86" height="20" rx="6" fill="#9ca3af"/>
  <text x="738" y="419" text-anchor="middle" class="tag">DURABLE</text>
</svg>
